<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pip, curious (as pipsim draws "curious"): the round black glass, a smaller left eye tipped back, a big right
       one, both pupils looking down to the left -->
  <circle cx="32" cy="32" r="31" fill="#000"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#2a2a31" stroke-width="2"/>
  <ellipse cx="17" cy="30" rx="9" ry="12" transform="rotate(-14 17 30)" fill="#fff"/>
  <ellipse cx="42" cy="34" rx="13" ry="14.5" transform="rotate(-12 42 34)" fill="#fff"/>
  <ellipse cx="14.2" cy="32" rx="3.8" ry="6.4" transform="rotate(8 14.2 32)" fill="#1c1c1c"/>
  <ellipse cx="35.5" cy="36.5" rx="5.2" ry="7.6" transform="rotate(6 35.5 36.5)" fill="#1c1c1c"/>
</svg>
